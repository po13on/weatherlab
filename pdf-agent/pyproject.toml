[project]
name = "btom-pdf-agent"
version = "0.1.0"
description = "LangChain agent that reads multimodal PDFs with OCR and hybrid retrieval."
requires-python = ">=3.10"
dependencies = [
  "langchain==1.4.2",
  "langchain-core==1.6.4",
  "langchain-chroma==1.1.0",
  "langchain-text-splitters==1.1.2",
  "langchain-openai==1.6.5",
  "chromadb==1.5.9",
  "rank-bm25==0.2.2",
  "pypdf==6.19.0",
  "pillow==12.3.0",
  "reportlab==5.0.1",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
