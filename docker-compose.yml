# Optional sidecars only. This is not a microservice split.
# Interview line: a second process could run the same app as worker; Demo stays single FastAPI.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: weatherlab
      POSTGRES_PASSWORD: weatherlab
      POSTGRES_DB: weatherlab
    ports:
      - "5432:5432"
    volumes:
      - weatherlab_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  weatherlab_pg:
